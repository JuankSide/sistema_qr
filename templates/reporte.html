<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte y Gestión de Boletos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    .stats-card { display: flex; gap: 15px; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; }
    .status-disponible { color: #4ade80; font-weight: bold; }
    .status-usado { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>📊 Reporte de Boletos</h2>
      <div>
        <a href="/escanear" class="btn btn-blue">📱 Ir al Escáner</a>
        <button class="btn btn-red" onclick="resetearTodos()">🔄 Resetear Todos</button>
      </div>
    </header>

    <div class="stats-card">
      <div class="card">
        <h3>Total</h3>
        <p style="font-size:1.5rem; font-weight:bold;">{{ total }}</p>
      </div>
      <div class="card">
        <h3>Disponibles</h3>
        <p style="font-size:1.5rem; font-weight:bold; color:#4ade80;">{{ disponibles }}</p>
      </div>
      <div class="card">
        <h3>Usados</h3>
        <p style="font-size:1.5rem; font-weight:bold; color:#f87171;">{{ usados }}</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Código ID</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        {% for boleto in boletos %}
        <tr>
          <td><strong>{{ boleto[0] }}</strong></td>
          <td>
            <span class="{% if boleto[1] == 'DISPONIBLE' %}status-disponible{% else %}status-usado{% endif %}">
              {{ boleto[1] }}
            </span>
          </td>
          <td>
            {% if boleto[1] == 'USADO' %}
            <button class="btn btn-green btn-sm" onclick="reactivarBoleto('{{ boleto[0] }}')">Reactivar</button>
            {% else %}
            <span style="color:#64748b; font-size:0.85rem;">Listo para usar</span>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    async function reactivarBoleto(codigo) {
      if (!confirm(`¿Reactivar el boleto ${codigo}?`)) return;

      const res = await fetch('/api/reactivar_boleto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo: codigo })
      });
      const data = await res.json();
      if (data.status === 'exito') {
        location.reload();
      } else {
        alert(data.mensaje);
      }
    }

    async function resetearTodos() {
      if (!confirm('⚠️ ¿Estás seguro de que deseas marcar TODOS los boletos como DISPONIBLES?')) return;

      const res = await fetch('/api/resetear_todos', { method: 'POST' });
      const data = await res.json();
      if (data.status === 'exito') {
        location.reload();
      } else {
        alert(data.mensaje);
      }
    }
  </script>

</body>
</html>
