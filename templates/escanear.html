<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Boletos QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin: 0 auto; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border-radius: 10px; overflow: hidden; background: white; }
        #resultado { margin-top: 20px; font-size: 1.1rem; font-weight: bold; padding: 15px; border-radius: 8px; display: none; max-width: 400px; margin-left: auto; margin-right: auto; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .btn-logout { background: #dc3545; color: white; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

  <div class="header">
        <h2>🎟️ Validador</h2>
        <div>
            <a href="/reporte" style="background: #28a745; color: white; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-size: 0.9rem; margin-right: 5px;">📊 Reporte</a>
            <a href="/logout" class="btn-logout">Salir</a>
        </div>
    </div>

    <div id="reader"></div>
    <div id="resultado"></div>

    <script>
        let escaneando = true;

        function onScanSuccess(decodedText) {
            if (!escaneando) return;
            escaneando = false;

            const resDiv = document.getElementById('resultado');
            resDiv.style.display = 'block';
            resDiv.className = 'warning';
            resDiv.innerText = '⏳ Consultando servidor...';

            fetch('/api/validar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo: decodedText })
            })
            .then(res => {
                if (!res.ok) throw new Error('Error en respuesta del servidor');
                return res.json();
            })
            .then(data => {
                resDiv.className = data.status;
                resDiv.innerText = data.mensaje;

                setTimeout(() => {
                    resDiv.style.display = 'none';
                    escaneando = true;
                }, 3000);
            })
            .catch(err => {
                resDiv.className = 'error';
                resDiv.innerText = '❌ Error de comunicación con la base de datos.';
                console.error(err);
                setTimeout(() => {
                    resDiv.style.display = 'none';
                    escaneando = true;
                }, 3000);
            });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
