<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .nav-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .btn-nav {
      background: #334155;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #0f172a;
    }

    /* Targeta de Alerta de Estado Grande */
    .status-card {
      display: none;
      margin-top: 15px;
      padding: 20px;
      border-radius: 12px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .status-card h2 { margin: 0 0 8px 0; font-size: 1.4rem; }
    .status-card p { margin: 0; font-size: 1rem; opacity: 0.9; }

    .status-valid   { background: #15803d; color: #f0fdf4; border: 2px solid #22c55e; }
    .status-warning { background: #b45309; color: #fffbeb; border: 2px solid #f59e0b; }
    .status-invalid { background: #b91c1c; color: #fef2f2; border: 2px solid #ef4444; }

    .btn-reset {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="/reporte" class="btn-nav">📊 Ver Reportes</a>
    <a href="/logout" class="btn-nav" style="background: #991b1b;">🚪 Salir</a>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">🎟️ Escáner de Entradas</h2>
    
    <div id="reader"></div>

    <div id="statusCard" class="status-card">
      <h2 id="statusTitle"></h2>
      <p id="statusMsg"></p>
    </div>

    <button id="btnReset" class="btn-reset" onclick="reiniciarEscaneo()">📷 Escanear Siguiente Boleto</button>
  </div>

  <script>
    let html5QrcodeScanner = null;
    let isProcessing = false;

    async function validarCodigo(codigo) {
      const statusCard = document.getElementById('statusCard');
      const statusTitle = document.getElementById('statusTitle');
      const statusMsg = document.getElementById('statusMsg');

      try {
        const response = await fetch("/api/validar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ codigo: codigo })
        });
        
        const data = await response.json();

        statusCard.className = "status-card status-" + (data.status || 'invalid');
        statusTitle.innerText = data.titulo || "PROCESADO";
        statusMsg.innerText = data.mensaje;
        statusCard.style.display = "block";

      } catch (error) {
        statusCard.className = "status-card status-invalid";
        statusTitle.innerText = "❌ ERROR DE RED";
        statusMsg.innerText = "No se pudo comunicar con el servidor.";
        statusCard.style.display = "block";
      }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      if (html5QrcodeScanner) {
        try { await html5QrcodeScanner.clear(); } catch (e) {}
      }

      document.getElementById('btnReset').style.display = "block";
      validarCodigo(decodedText);
    }

    function iniciarEscaner() {
      isProcessing = false;
      document.getElementById('statusCard').style.display = "none";
      document.getElementById('btnReset').style.display = "none";

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 10, 
        qrbox: { width: 220, height: 220 }
      });
      
      html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    function reiniciarEscaneo() {
      iniciarEscaner();
    }

    window.addEventListener('DOMContentLoaded', iniciarEscaner);
  </script>
</body>
</html>
